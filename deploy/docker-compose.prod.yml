# Production override for a single VM (Oracle Ampere Always-Free, or any box).
# Usage:
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# What it changes vs the dev compose:
#   - Only the WEB port (3001) is public. Postgres/Redis/API bind to localhost only,
#     so the DB and API aren't exposed to the internet.
#   - The browser talks ONLY to web:3001; Next.js proxies /api/backend/* to the api
#     container internally (NEXT_PUBLIC_API_URL=http://api:8000). No CORS, no public API.
#   - API runs without --reload (production).

services:
  postgres:
    ports: ["127.0.0.1:15432:5432"]   # local-only (for psql/backup on the box)

  redis:
    ports: ["127.0.0.1:16379:6379"]   # local-only

  api:
    ports: ["127.0.0.1:8001:8000"]    # local-only; reached via the web proxy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    # trim concurrency for a small VM; raise on a bigger Ampere box
    command: celery -A app.core.celery_app.celery worker --loglevel=info --concurrency=1 -Q celery,default,discovery,scoring,outreach,embeddings

  web:
    environment:
      # The web container proxies API calls internally over the compose network.
      NEXT_PUBLIC_API_URL: http://api:8000
      NODE_ENV: production
    ports: ["3001:3001"]              # the ONLY public port
